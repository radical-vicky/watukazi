{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 500px; margin: 0 auto; text-align: center;">
        <div class="card">
            <div class="card-body" style="padding: 3rem;">
                <h1 style="font-size: 4rem; font-weight: 700; color: var(--blue-primary); margin-bottom: 1rem;">404</h1>
                <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Page Not Found</h2>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">The page you are looking for does not exist or has been moved.</p>
                <a href="/" class="btn btn-primary">Return Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
