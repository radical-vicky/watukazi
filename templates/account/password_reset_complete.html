{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block extra_css %}
<style>
    .success-container {
        max-width: 440px;
        margin: 0 auto;
    }
    
    .success-card {
        background: var(--bg-secondary);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 2rem;
        text-align: center;
    }
    
    .success-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }
    
    .success-message {
        color: var(--text-secondary);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
        line-height: 1.5;
    }
    
    .action-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: 0.5rem;
    }
    
    .button-group {
        display: flex;
        gap: 1rem;
        justify-content: center;
    }
    
    @media (max-width: 640px) {
        .button-group {
            flex-direction: column;
            gap: 0.75rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="success-container">
        <div class="success-card">
            <div class="success-title">Password Reset Complete</div>
            <div class="success-message">
                Your password has been successfully reset. You can now log in with your new password.
            </div>
            
            <div class="button-group">
                <a href="{% url 'accounts:worker_login' %}" class="btn btn-primary">Login as Worker</a>
                <a href="{% url 'accounts:employer_login' %}" class="btn btn-secondary">Login as Employer</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
