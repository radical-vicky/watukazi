{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="container">
    <div style="max-width: 400px; margin: 0 auto;">
        <div class="card">
            <div class="card-header">Change Password</div>
            <div class="card-body">
                {% if form.errors %}
                    <div class="alert alert-error">
                        Please correct the errors below.
                    </div>
                {% endif %}
                
                <form method="post" action="{% url 'account_change_password' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="form-label">Current Password</label>
                        <input type="password" name="oldpassword" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input type="password" name="password1" class="form-input" required>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">Minimum 8 characters</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" name="password2" class="form-input" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
